name: checks

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  checks:
    name: checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install bootstrap validator dependency
        run: python -m pip install --disable-pip-version-check -r tools/requirements-bootstrap.txt

      - name: Validate public repository foundation
        run: python tools/validate_repository.py --git-index
