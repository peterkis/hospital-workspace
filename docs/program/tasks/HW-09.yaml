  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW09-07
  title: 首个低风险 Agent：报修分诊建议
  primary_owner: terra_worker
  supporting_agents:
  - luna_fixtures
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: E
  risk: high
  depends_on:
  - HW09-04
  - HW09-06
  allowed_paths:
  - services/agent-gateway/src/scenarios/ticket-triage/**
  - apps/workspace-web/src/capabilities/agents/**
  - services/tickets/src/agent-tools/**
  objective: 用只读/建议模式验证 Agent 团队，不自动创建或改变工单。
  steps:
  - 输入最小化报修文本和已授权上下文。
  - Coordinator 可分派分类、紧急度、补充问题 Worker。
  - 输出结构化建议卡，由用户确认后通过 Ticket Service 命令执行。
  - 模型/Provider 失败时回退规则分类或人工流程。
  - 建立 golden dataset 和误判/漏判指标。
  validation:
  - golden eval
  - provider failure
  - malicious prompt
  - user reject
  - audit
  acceptance:
  - 未达到质量阈值保持建议模式
  - AI 失败不影响报修留痕
  evidence:
  - ticket-triage-agent-eval.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW09-08
