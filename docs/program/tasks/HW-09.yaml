  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: F
  risk: critical
  depends_on:
  - HW09-03
  - HW09-04
  - HW09-05
  - HW09-07
  allowed_paths:
  - services/agent-gateway/**
  - packages/agent-contracts/**
  - packages/tool-contracts/**
  - apps/workspace-web/src/capabilities/agents/**
  objective: 确认 Agent 能提高协作效率但无法获得超越人员和业务服务的权限。
  steps:
  - 红队 prompt injection、tool injection、越权、数据外泄、取消/晚到、重复审批、模型幻觉完成。
  - 审查成本、日志、敏感 prompt 和 Provider 配置。
  - 签发 G09。
  validation:
  - red-team suite
  - full agent E2E
  - security review
  acceptance:
  - P0/P1 为零
  - 只批准低风险建议场景
  evidence:
