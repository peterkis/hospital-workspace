acceptance_policy:
  task_routing:
    low_medium:
      required_agents:
      - terra_reviewer
      required_outcome: APPROVED
    high:
      required_agents:
      - terra_reviewer
      - sol_acceptance
      required_sol_outcome: ACCEPT
    critical:
      required_agents:
      - terra_reviewer
      - terra_security
      - sol_architecture_security
      required_sol_outcome: ACCEPT
      exception: Critical tasks that are primarily E2E/acceptance evidence route to sol_acceptance instead of sol_architecture_security.
  phase_gate:
    required_agents:
    - sol_acceptance
    - sol_architecture_security
    - sol_phase_gate
    required_sol_phase_outcome: PASS_RECOMMENDED
    final_decision_owner: parent_codex
    human_decision_required: false
  sol_unavailable: BLOCKED unless the user explicitly approves a model-routing change; no silent substitution.
