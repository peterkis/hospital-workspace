  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW10-08
  title: Knowledge Governance Gate
  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: G
  risk: critical
  depends_on:
  - HW10-02
  - HW10-05
  - HW10-06
  - HW10-07
  allowed_paths:
  - services/knowledge/**
  - services/agent-gateway/src/scenarios/knowledge/**
  - apps/workspace-web/src/capabilities/knowledge/**
  objective: 确认知识资产可持续增长且可治理，不把 LLM 输出直接当临床知识。
  steps:
  - 审查来源、版本、scope、审校、Agent、检索、retire 和审计。
  - 签发 G10。
  validation:
  - full knowledge suite
  - red-team
  - security review
  acceptance:
  - P0/P1 为零
  - 只批准 synthetic/非临床生产知识试点
  evidence:
  - G10-gate-decision.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-phase-gate
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_acceptance
  - sol_phase_gate
  acceptance_outcome: PASS_RECOMMENDED
acceptance_policy:
  task_routing:
    low_medium:
      required_agents:
      - terra_reviewer
      required_outcome: APPROVED
    high:
      required_agents:
      - terra_reviewer
      - sol_acceptance
      required_sol_outcome: ACCEPT
    critical:
      required_agents:
      - terra_reviewer
      - terra_security
      - sol_architecture_security
      required_sol_outcome: ACCEPT
      exception: Critical tasks that are primarily E2E/acceptance evidence route to sol_acceptance instead of sol_architecture_security.
  phase_gate:
    required_agents:
    - sol_acceptance
    - sol_phase_gate
    required_sol_phase_outcome: PASS_RECOMMENDED
    final_decision_owner: parent_codex
    human_decision_required: false
  sol_unavailable: BLOCKED unless the user explicitly approves a model-routing change; no silent substitution.
