schemaVersion: hospital-workspace.phase.v1
program: hospital-workspace
targetRepository: peterkis/hospital-workspace
legacySource:
  mode: optional-local
  required: false
  absencePolicy: reimplement-from-target-contracts
  configPath: config/local/legacy-source.yaml
referenceSource:
  repository: HirezmingD/Knowe-agent-groupchat
  commit: 1e584f84734e9db55515ef4391fcb9e9c40399cd
id: HW-10
title: 知识整理项目、治理生命周期与 Agent 协作
goal: 将知识整理作为一类一等工作项：文档、知识节点、关系、来源、版本、院级/院区/科室/项目范围、active/retired 和专家审校均可追溯；Agent 只能提出建议，专家裁决为权威。
dependsOn:
- HW-05
- HW-09
deliverables:
- '`services/knowledge` 与 `knowledge-contracts`'
- Knowledge Node/Relation/Source/Version/Review 数据模型
- active/retired 和 hospital/campus/department/project scope
- 知识编译/审校 Harness
- Workspace Knowledge Project Capability
- Coordinator/Worker 知识整理 Agent
- 可选 Hybrid Retrieval 接口与 provenance
outOfScope:
- 直接导入真实病历
- 未经专家审校自动发布临床知识
- 首期复杂全院知识图谱推理
- 将向量库作为知识真相
acceptance:
- 知识节点/关系/版本/来源/scope/active-retired 可追溯
- 未审校建议不能发布为 active
- 专家 Decision 是最终权威
- 检索先授权再排序，retired/draft 默认排除
- 从 synthetic 文档到发布/退役/检索完成全链
gates:
- G10-1 知识来源/版本/范围
- G10-2 用户审校权威
- G10-3 active/retired 生命周期
- G10-4 Agent 抽取与发布隔离
- G10-5 检索 provenance 与权限
tasks:
- id: HW10-01
  title: 定义 Knowledge Contracts 与生命周期
  primary_owner: terra_contracts
  supporting_agents:
  - luna_fixtures
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on: []
  allowed_paths:
  - packages/knowledge-contracts/**
  - packages/harness-contracts/**
  - packages/hub-contracts/**
  objective: 定义 KnowledgeProject、SourceDocument、Node、Relation、Claim、Version、Review、Decision 和 Scope。
  steps:
  - Node type 支持 topic/entity/decision/constraint/risk/artifact/lesson/standard。
  - 状态包含 draft/in_review/approved/active/retired/rejected。
  - scope 支持 hospital/campus/department/project，并有继承/覆盖规则。
  - 每个 claim/relation 有 sourceRef、locator、extractor、confidence、review。
  - retired 不删除历史，supersedes 链可追踪。
  validation:
  - state/scope tests
  - provenance fixtures
  - supersede/retire
  acceptance:
  - 任何知识结论可回到来源和专家裁决
  - 模型置信度不等于批准
  evidence:
  - knowledge-contract-snapshot.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW10-02
  title: 实现 Knowledge Service 与数据库
  primary_owner: parent_codex
  supporting_agents:
  - terra_worker
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: B
  risk: critical
  depends_on:
  - HW10-01
  allowed_paths:
  - services/knowledge/**
  - database/prisma/models/knowledge.prisma
  objective: 实现知识项目、节点、版本、关系、来源、审校和范围查询。
  steps:
  - 新建 knowledge schema/migration。
  - 写操作使用 expectedVersion/idempotency，审批/发布走状态机。
  - 来源文档只保存受控 assetRef/hash/metadata。
  - 权限按 scope、项目成员和审校角色。
  - retire/supersede 保留历史与事件。
  validation:
  - service integration
  - scope/permission
  - version conflict
  - retire history
  - migration rebuild
  acceptance:
  - 知识服务是权威，向量索引只是派生
  - 未审校内容不能标 active
  evidence:
  - knowledge-service-report.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-architecture-security
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_architecture_security
  acceptance_outcome: ACCEPT
- id: HW10-03
  title: 实现 Knowledge WorkItem/Harness Mapping
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: B
  risk: high
  depends_on:
  - HW10-02
  - HW05-04
  allowed_paths:
  - services/collaboration/src/mappings/knowledge/**
  objective: 将文档摄取、抽取、审校、批准、发布和退役投影为工作项、Decision、Handoff 和 Todo。
  steps:
  - 每个 KnowledgeProject 一个空间/主线程，文档或批次可形成子工作项。
  - 审校人收到 Todo；批准/拒绝产生 Decision 活动。
  - Agent 建议与专家裁决分层显示。
  - 重放可恢复项目进度。
  validation:
  - projection replay
  - review assignment
  - decision authority
  acceptance:
  - 知识治理过程透明
  - 模型结果不会绕过审校
  evidence:
  - knowledge-workitem-receipt.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW10-04
  title: 实现 Workspace Knowledge Project Capability
  primary_owner: terra_worker
  supporting_agents:
  - terra_browser
  - luna_fixtures
  execution_mode: workspace-write
  parallel_group: C
  risk: medium
  depends_on:
  - HW10-02
  - HW10-03
  allowed_paths:
  - apps/workspace-web/src/capabilities/knowledge/**
  objective: 提供文档来源、知识节点、关系、审校队列、版本比较和发布/退役 Canvas。
  steps:
  - 时间线显示摄取、抽取、Agent 建议、专家评论、Decision 和发布。
  - Node/Relation 显示来源 locator 和版本差异。
  - 审批卡支持 approve/reject/request_changes/retire。
  - 按 scope 过滤，未授权节点不可搜索或预览。
  validation:
  - component/a11y
  - version diff
  - scope privacy
  - decision flow
  acceptance:
  - 专家能基于来源审校
  - active/retired 状态清晰
  evidence:
  - knowledge-ui-evidence.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW10-05
  title: 实现知识整理 Coordinator／Worker
  primary_owner: terra_worker
  supporting_agents:
  - terra_contracts
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: D
  risk: high
  depends_on:
  - HW09-03
  - HW10-02
  allowed_paths:
  - services/agent-gateway/src/scenarios/knowledge/**
  - services/knowledge/src/agent-tools/**
  objective: 按资料解析、术语标准化、FHIR 映射、质量核查、知识审校建议拆分 Agent Worker。
  steps:
  - Coordinator 根据项目模板创建有界任务。
  - Worker 只读 Source/Knowledge API，输出 structured proposals 和 provenance。
  - 写入 draft proposal 需要工具权限；批准发布必须专家 Decision。
  - 失败、低置信、来源冲突进入 blocked/waiting_user。
  - Handoff 保留上游来源、假设和未解决问题。
  validation:
  - golden fixtures
  - conflicting sources
  - low confidence
  - expert reject
  - cancel/restart
  acceptance:
  - Agent 加速整理但不能自我发布
  - 每项建议有来源
  evidence:
  - knowledge-agent-eval.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW10-06
  title: 建立派生检索与 Provenance API
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: E
  risk: high
  depends_on:
  - HW10-02
  allowed_paths:
  - services/knowledge/src/search/**
  - packages/search-contracts/**
  - infrastructure/search/**
  objective: 提供关键词/向量/关系的混合检索接口，但结果只返回当前用户可见的 active/approved 知识及来源。
  steps:
  - 首期可用 PostgreSQL FTS + pgvector 或批准的独立索引；索引不是权威。
  - 索引事件来自 Knowledge Outbox，可重建。
  - 查询先执行 scope filter，再排序/rerank。
  - 每个结果包含 nodeVersion、sourceRefs、score components。
  - draft/retired 默认不进入普通检索。
  validation:
  - index rebuild
  - scope leakage
  - retired exclusion
  - provenance
  acceptance:
  - 删除索引可从权威数据重建
  - 无跨 scope 召回
  evidence:
  - knowledge-search-report.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW10-07
  title: 知识治理 E2E 与专家裁决测试
  primary_owner: terra_tester
  supporting_agents:
  - terra_browser
  - terra_security
  execution_mode: workspace-write
  parallel_group: F
  risk: critical
  depends_on:
  - HW10-03
  - HW10-04
  - HW10-05
  - HW10-06
  allowed_paths:
  - services/knowledge/test/**
  - apps/workspace-web/e2e/knowledge/**
  - evidence/HW-10/**
  objective: 从 synthetic 文档到 Agent 建议、专家修改、批准、发布、检索、退役和 supersede 完成全链。
  steps:
  - 包含来源冲突、低置信、错误抽取、专家拒绝和版本竞争。
  - 验证 scope、撤权、日志和通知脱敏。
  - 索引中断后恢复重建。
  - 比较 Agent proposal 与最终专家版本。
