  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW04-08
  title: Event Collaboration Gate
  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: F
  risk: critical
  depends_on:
  - HW04-03
  - HW04-04
  - HW04-05
  - HW04-07
  allowed_paths:
  - services/collaboration/**
  - packages/hub-*/**
  - packages/outbox-sdk/**
  - apps/workspace-web/src/platform/events/**
  objective: 确认事件平台可靠且只是投影/传输层，不拥有业务真相。
  steps:
  - 审查 Catalog、Outbox、Event Store、Inbox/Todo、SSE、replay、redaction。
  - 查找 producer 直发、客户端多连接、exactly-once 虚假承诺和越权 recipient。
  - 签发 G04。
  validation:
  - full collaboration suite
  - replay state hash
  - security review
  acceptance:
  - P0/P1 为零
  - 允许 Work Item 与领域服务接入
  evidence:
  - G04-gate-decision.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
