- id: HW04-07
  title: Synthetic Event End-to-End
  primary_owner: terra_tester
  supporting_agents:
  - luna_fixtures
  - terra_browser
  execution_mode: workspace-write
  parallel_group: E
  risk: high
  depends_on:
  - HW04-03
  - HW04-05
  - HW04-06
  allowed_paths:
  - services/collaboration/test/**
  - apps/workspace-web/e2e/**
  - packages/testkit/**
  - evidence/HW-04/**
  objective: 在没有真实业务领域前走通 command fixture→outbox→event→inbox/todo→SSE→UI→read。
  steps:
  - 创建仅测试启用的 synthetic producer。
  - 覆盖成功、重复、乱序、延迟、poison、断线和 Session 撤销。
  - 证明刷新后从 durable state 重建。
  - 生产构建不包含测试端点/seed。
  validation:
  - full E2E
  - failure injection
  - production absence scan
  acceptance:
  - 闭环可重复
  - 测试能力不进入 production registry
  evidence:
  - synthetic-event-e2e.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
