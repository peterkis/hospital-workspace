- id: HW12-06
  title: 实现 Server/Workspace/Desktop 分环灰度
  primary_owner: parent_codex
  supporting_agents:
  - terra_worker
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: D
  risk: critical
  depends_on:
  - HW12-02
  - HW12-03
  - HW12-04
  allowed_paths:
  - services/gateway/src/registry/releases/**
  - infrastructure/releases/**
  - apps/desktop-shell/**
  - docs/ops/release-rings.md
  objective: 分别管理服务端、Workspace 静态 release 和 Desktop Runtime 版本兼容，支持试点/科室/院区分环。
  steps:
  - Capability/Workspace release 声明 min/max Desktop Runtime 和 API contract version。
  - Gateway 按 ring 选择 approved release。
  - 不兼容组合 fail-closed 并提供升级提示/浏览器降级入口。
  - 每环有观察期、自动停止条件和回滚。
  validation:
  - version skew
  - ring rollout
  - rollback
  - offline/stale client
  acceptance:
  - 不可兼容版本不被运行
  - 回滚不需重装全部组件
  evidence:
  - release-ring-receipt.json
  stop_if:
