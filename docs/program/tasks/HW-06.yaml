schemaVersion: hospital-workspace.phase.v1
program: hospital-workspace
targetRepository: peterkis/hospital-workspace
legacySource:
  mode: optional-local
  required: false
  absencePolicy: reimplement-from-target-contracts
  configPath: config/local/legacy-source.yaml
referenceSource:
  repository: HirezmingD/Knowe-agent-groupchat
  commit: 1e584f84734e9db55515ef4391fcb9e9c40399cd
id: HW-06
title: 首个真实垂直切片：信息报修与协作工单
goal: 以报修作为第一个真实领域，验证多人参与、状态机、图片附件、接单/派单/转派、SLA、Incident 合并、Outbox、Work Item、时间线与桌面触达。
dependsOn:
- HW-05
deliverables:
- '`services/tickets` 独立领域服务'
- '`ticket-contracts` 与状态机'
- 受控附件服务与审计
- Ticket Outbox/Event/WorkItem mapping
- Workspace Tickets Capability
- 临床用户与工程师多人 E2E
- 内部信息科 MVP Gate
outOfScope:
- LLM 自动报修正式启用
- ITSM 全量资产管理
- 企业微信替换
- 全院试点
acceptance:
- Ticket 状态机、并发接单、SLA 和 Incident 规则通过
- 附件无 IDOR、路径泄漏和 MIME 绕过
- Ticket/Outbox/Event/WorkItem/Timeline 可重放一致
- 临床用户与工程师在 Workspace 完成闭环
- 只批准信息科内部非生产 MVP
gates:
- G06-1 Ticket 领域权威与状态机
- G06-2 并发/幂等/SLA
- G06-3 附件与敏感数据安全
- G06-4 WorkItem/Timeline 映射
- G06-5 多用户恢复与内部 MVP
tasks:
- id: HW06-01
  title: 审计并白名单抽取 Legacy Ticket Domain
  primary_owner: terra_migrator
  supporting_agents:
  - luna_explorer
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on: []
  allowed_paths:
  - docs/migration/tickets/**
  - services/tickets/**
  - packages/ticket-contracts/**
  objective: 按目标 Ticket 契约重新实现状态机、repository、outbox、附件与测试；若配置可选旧源，仅作需求核对和算法提取，拒绝复制 Next UI、页面会话与旧通知入口。
  steps:
  - 生成调用链和文件分类 KEEP/ADAPT/REFERENCE/REJECT。
  - 固定 source commit 和每个迁移文件 hash。
  - 抽取领域术语、状态、动作、SLA 和 Incident 规则。
  - 将旧 Prisma model 作为需求参考，不复制 migration。
  - 记录行为差异和需要重新实现的部分。
  validation:
  - source manifest
  - behavior fixture extraction
  - no Next/UI import scan
  acceptance:
  - 领域规则来源可追溯
  - 新服务未依赖 legacy workspace
  evidence:
  - ticket-migration-plan.yaml
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW06-02
  title: 冻结 Ticket Contracts 与状态机
  primary_owner: terra_contracts
  supporting_agents:
  - luna_fixtures
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on:
  - HW06-01
  allowed_paths:
  - packages/ticket-contracts/**
  - packages/card-protocol/**
  - packages/hub-contracts/**
  objective: 定义 Ticket、Incident、Participant、AttachmentRef、SLA、命令、事件和卡片协议。
  steps:
  - 状态至少覆盖 draft/submitted/triaged/assigned/accepted/in_progress/resolved/closed/reopened/cancelled。
  - 每个 action 指定 actor、前置状态、权限和输出事件。
  - Incident 关联 Intake/Ticket，不删除个人申报留痕。
  - Attachment 只暴露 assetRef，不暴露路径。
  - 事件注册到 Catalog，通知摘要默认无患者信息。
  validation:
  - transition table
  - invalid actor/status
  - event/card fixtures
  - assetRef validation
  acceptance:
  - 所有状态变化只能由命令产生
  - 可表达个人工单与公共故障
  evidence:
  - ticket-contract-snapshot.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW06-03
  title: 实现 Ticket Service 与数据库模型
  primary_owner: parent_codex
  supporting_agents:
  - terra_worker
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: B
  risk: critical
  depends_on:
  - HW06-02
  allowed_paths:
  - services/tickets/**
  - database/prisma/models/ticket.prisma
  - database/migrations/**
  objective: 实现独立 Ticket 领域服务、repository、状态机、权限和审计。
  steps:
  - 新增 ticket schema，生成新 migration，不复制旧历史。
  - API/command handler 只接受 Gateway 传递并可验证的 Principal context。
  - 每次写入使用 expectedVersion 和 idempotency。
  - repository 仅访问 ticket schema，跨域信息通过 API/ContextRef。
  - health、graceful stop、DB/Redis dependency 明确。
  validation:
  - service unit/integration
  - database migration/rebuild
  - permission/scope
  - state table
  acceptance:
  - 服务可独立部署
  - Workspace/Collaboration 不直接写 ticket 表
  evidence:
  - ticket-service-report.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-architecture-security
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_architecture_security
  acceptance_outcome: ACCEPT
- id: HW06-04
  title: 实现 Ticket Outbox、事件与 WorkItem Mapping
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: B
  risk: high
  depends_on:
  - HW06-03
  - HW04-03
  - HW05-03
  allowed_paths:
  - services/tickets/src/events/**
  - services/collaboration/src/mappings/tickets/**
  objective: 让工单状态与 Outbox 同事务，并确定性投影为线程、工作项、待办和活动。
  steps:
  - 提交/派单/接单/处理/解决/关闭/重开均产生版本事件。
  - 为申报人、工程师和管理员分别计算 Inbox/Todo。
  - SLA 超时由幂等 scheduler/worker 产生事件。
  - Incident 合并保留原 Ticket/Intake 活动。
  validation:
  - outbox crash
  - replay mapping
  - recipient scope
  - SLA retry
  acceptance:
  - 不丢单、不重复接单
  - 重放可恢复相同工作项
  evidence:
  - ticket-event-workitem-receipt.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW06-05
  title: 实现受控附件链
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: C
  risk: critical
  depends_on:
  - HW06-03
  allowed_paths:
  - services/tickets/src/attachments/**
  - packages/asset-contracts/**
  - infrastructure/storage/**
  objective: 支持报修图片和文件，同时防止路径泄漏、MIME 欺骗、跨工单访问和长期公开 URL。
  steps:
  - 创建 upload intent、size/MIME/hash 校验和短时 assetRef。
  - 存储可先用 MinIO/S3-compatible；生产 URL 由服务端授权流式或短时签名。
  - 文件名归一化，病毒扫描接口保留，失败 quarantine。
  - 下载每次验证 Ticket 权限/Scope。
  - 事件/日志只记录 assetRef 和安全 metadata。
  validation:
  - malicious filename
  - MIME mismatch
  - oversize
  - cross-ticket IDOR
  - replay
  acceptance:
  - 不存在任意文件读写和公开永久链接
  - 审计可追踪上传/查看
  evidence:
  - attachment-security-report.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-architecture-security
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_architecture_security
  acceptance_outcome: ACCEPT
- id: HW06-06
  title: 实现 Workspace Tickets Capability
  primary_owner: terra_worker
  supporting_agents:
  - terra_browser
  - luna_fixtures
  execution_mode: workspace-write
  parallel_group: D
  risk: medium
  depends_on:
  - HW06-02
  - HW06-04
  - HW06-05
  allowed_paths:
  - apps/workspace-web/src/capabilities/tickets/**
  - packages/ui/**
  objective: 用空间、队列、线程、卡片和 Canvas 取代旧报修网页。
  steps:
  - 空间包含我的报修、待接单、处理中、本科室、已完成。
  - 每张工单一个线程，时间线显示参与者、状态、附件和系统事件。
  - 卡片支持提交、补充、接单、转派、进展、解决、确认/重开。
  - 复杂详情和附件在右侧 Canvas。
  - 冲突/过期/越权有明确刷新和说明。
  validation:
  - component tests
  - a11y
  - deep link
  - 403/409/expired
  - attachment E2E
  acceptance:
  - 用户不离开 Workspace 完成报修闭环
  - UI 只展示服务端允许动作
  evidence:
  - tickets-capability-evidence.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW06-07
  title: 多人并发、故障与恢复 E2E
  primary_owner: terra_tester
  supporting_agents:
  - terra_browser
  - terra_security
  execution_mode: workspace-write
  parallel_group: E
  risk: critical
  depends_on:
  - HW06-04
  - HW06-06
  allowed_paths:
  - services/tickets/test/**
  - apps/workspace-web/e2e/tickets/**
  - evidence/HW-06/**
  objective: 验证临床用户、两个工程师、管理员在并发、断线和服务故障下的一致性。
  steps:
  - 两个工程师同时接单，只允许一个成功。
  - relay/Hub 中断、客户端断线、服务重启、附件中断。
  - 切换人员、锁屏、撤权和跨科室访问。
  - 最终领域状态、工作项和时间线 hash 对账。
  validation:
  - multi-user Playwright
  - race tests
  - failure injection
  - replay hash
  acceptance:
  - 无双接单、状态倒退或跨用户泄漏
  - 故障后最终一致
  evidence:
  - ticket-multiuser-e2e.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW06-08
  title: 信息科内部 MVP Gate
  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: F
  risk: critical
  depends_on:
  - HW06-03
  - HW06-05
  - HW06-07
  allowed_paths:
  - services/tickets/**
  - apps/workspace-web/src/capabilities/tickets/**
  - services/collaboration/**
  objective: 确认第一个真实领域证明新架构可用，但不等于医院试点。
  steps:
  - 复核状态机、并发、附件、权限、Outbox、WorkItem、UI 和恢复。
  - 评估信息科小范围 synthetic/非生产内部试用。
  - 签发 G06-MVP。
  validation:
  - full ticket suite
  - security review
  - MVP usability checklist
  acceptance:
  - P0/P1 为零
  - 只批准内部非患者敏感 MVP
  evidence:
  - G06-MVP-gate-decision.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-phase-gate
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_acceptance
  - sol_phase_gate
  acceptance_outcome: PASS_RECOMMENDED
acceptance_policy:
  task_routing:
    low_medium:
      required_agents:
      - terra_reviewer
      required_outcome: APPROVED
    high:
      required_agents:
      - terra_reviewer
      - sol_acceptance
      required_sol_outcome: ACCEPT
    critical:
      required_agents:
      - terra_reviewer
      - terra_security
      - sol_architecture_security
      required_sol_outcome: ACCEPT
      exception: Critical tasks that are primarily E2E/acceptance evidence route to sol_acceptance instead of sol_architecture_security.
  phase_gate:
    required_agents:
    - sol_acceptance
    - sol_phase_gate
    required_sol_phase_outcome: PASS_RECOMMENDED
    final_decision_owner: parent_codex
    human_decision_required: false
  sol_unavailable: BLOCKED unless the user explicitly approves a model-routing change; no silent substitution.
