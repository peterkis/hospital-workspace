  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW02-08
  title: Identity & Access Gate
  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: G
  risk: critical
  depends_on:
  - HW02-03
  - HW02-04
  - HW02-05
  - HW02-06
  - HW02-07
  allowed_paths:
  - services/gateway/**
  - packages/identity-*/**
  - packages/authz-core/**
  - database/prisma/models/iam.prisma
  - database/prisma/models/config.prisma
  objective: 确认人员中心、Session、权限和 Scope 可以作为所有后续服务的唯一入口。
  steps:
  - 复核 token/cookie/CSRF/redirect/session/authz/scope/registry。
  - 扫描 PostgreSQL Session、localStorage token、客户端 secret 和隐式 allow。
  - 执行 Redis/Identity upstream failure drills。
  - 签发 G02。
  validation:
  - full identity suite
  - security scan
  - failure drills
  - independent review
  acceptance:
  - P0/P1 为零
  - 允许 Workspace 与平台服务接入真实 Principal
  evidence:
  - G02-gate-decision.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-phase-gate
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_architecture_security
  - sol_phase_gate
  acceptance_outcome: PASS_RECOMMENDED
acceptance_policy:
  task_routing:
    low_medium:
      required_agents:
      - terra_reviewer
      required_outcome: APPROVED
    high:
      required_agents:
      - terra_reviewer
      - sol_acceptance
      required_sol_outcome: ACCEPT
    critical:
      required_agents:
      - terra_reviewer
      - terra_security
      - sol_architecture_security
      required_sol_outcome: ACCEPT
      exception: Critical tasks that are primarily E2E/acceptance evidence route to sol_acceptance instead of sol_architecture_security.
  phase_gate:
    required_agents:
    - sol_architecture_security
    - sol_phase_gate
    required_sol_phase_outcome: PASS_RECOMMENDED
    final_decision_owner: parent_codex
    human_decision_required: false
  sol_unavailable: BLOCKED unless the user explicitly approves a model-routing change; no silent substitution.
