schemaVersion: hospital-workspace.phase.v1
program: hospital-workspace
targetRepository: peterkis/hospital-workspace
legacySource:
  mode: optional-local
  required: false
  absencePolicy: reimplement-from-target-contracts
  configPath: config/local/legacy-source.yaml
referenceSource:
  repository: HirezmingD/Knowe-agent-groupchat
  commit: 1e584f84734e9db55515ef4391fcb9e9c40399cd
id: HW-05
title: 工作项、上下文、卡片协议与 Harness
goal: 建立以任务和工作项为中心的协作内核：业务线程、活动时间线、结构化卡片、命令回执、Decision/Handoff 和 Harness 完成状态机；领域服务仍是业务真相。
dependsOn:
- HW-03
- HW-04
deliverables:
- '`services/collaboration` work-items/harness/decisions/handoffs 模块'
- WorkItem、Thread、Activity、Context、Card/Action Contracts
- Workspace Space/Thread/Timeline/Card/Canvas Runtime
- 用户裁决高于模型推断的 Decision 机制
- 确定性 Projection 和恢复
- synthetic work item 全闭环
outOfScope:
- 真实工单/确费/交班领域
- LLM Agent
- 任意动态 JavaScript 插件
- 客户端本地业务数据库
acceptance:
- WorkItem 只投影领域实例，不覆盖业务状态
- Card Action 具备 command/idempotency/version 且服务端确认完成
- Harness/Decision/Handoff 状态机拒绝非法转换
- 用户批准/拒绝高于模型建议
- Context 按需解析、重新授权且敏感数据不本地持久化
gates:
- G05-1 WorkItem 非业务真相
- G05-2 Timeline/Projection 可重建
- G05-3 Card Action 幂等与服务端确认
- G05-4 Harness/Decision/Handoff 状态机
- G05-5 Context 最小化与权限
tasks:
- id: HW05-01
  title: 定义 Space、Thread、WorkItem 与 Activity Contracts
  primary_owner: terra_contracts
  supporting_agents:
  - luna_fixtures
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on: []
  allowed_paths:
  - packages/workspace-contracts/**
  - packages/workitem-contracts/**
  objective: 将应用入口改为能力空间，将每笔业务/项目/Agent Run 映射为线程和工作项。
  steps:
  - Space 表示能力或协作范围；Thread 表示业务实例/项目；WorkItem 表示需要跟进的责任单元。
  - Activity 是事件的只读投影，保留 provenance。
  - WorkItem 引用 source aggregate 和 domainStatus，但不覆盖领域状态。
  - 定义 assignee/participants/priority/dueAt/contextRefs/version。
  - 提供 ticket/fee/handover/agent/knowledge fixtures。
  validation:
  - schema tests
  - cross-domain fixtures
  - invalid ownership/status tests
  acceptance:
  - 同一模型可表达用户列出的七类基本单位
  - 不把所有事件都误建为 Todo
  evidence:
  - workitem-contract-snapshot.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW05-02
  title: 定义 Card、Action 与 Canvas Protocol
  primary_owner: terra_contracts
  supporting_agents:
  - luna_fixtures
  - terra_security
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on:
  - HW01-02
  - HW05-01
  allowed_paths:
  - packages/card-protocol/**
  - packages/capability-sdk/**
  objective: 让高频业务通过结构化卡片处理，复杂详情通过 Canvas 展开，自然语言只负责表达与协作。
  steps:
  - Card 包含 type/version/data/status/actions/render hints，不携带可执行代码。
  - Action 引用已注册 commandType，必须有 commandId/idempotencyKey/expectedVersion。
  - Canvas 只能打开已注册 capability route。
  - 未知 card/version 降级为不可操作摘要。
  - 定义 sensitivity-aware field rendering。
  validation:
  - schema/renderer fixtures
  - unknown card
  - action replay
  - XSS/unsafe URL
  acceptance:
  - 无法通过 card 注入 JS/HTML/任意 endpoint
  - 动作只有服务端 accepted event 后完成
  evidence:
  - card-protocol-catalog.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW05-03
  title: 实现 Work Item Projection 与 Query API
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: B
  risk: high
  depends_on:
  - HW05-01
  - HW04-04
  allowed_paths:
  - services/collaboration/src/modules/work-items/**
  - database/prisma/models/collab.prisma
  objective: 从领域事件确定性投影工作项、参与者、期限和状态，不允许客户端任意创建权威状态。
  steps:
  - Projection handler 按 domain mapping 注册。
  - workItem version 与 source aggregate version 分离。
  - 支持 assigned/self/department/project 查询和服务端 Scope。
  - 事件重放可重建一致状态。
  - 手工备注作为 Activity，不修改领域状态。
  validation:
  - projection replay
  - scope matrix
  - out-of-order/duplicate
  - rebuild hash
  acceptance:
  - 同事件集产生相同 work item
  - 跨科室查询被拒
  evidence:
  - workitem-projection-receipt.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW05-04
  title: 实现 Harness、Decision 与 Handoff 状态机
  primary_owner: parent_codex
  supporting_agents:
  - terra_contracts
  - terra_tester
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: B
  risk: critical
  depends_on:
  - HW05-01
  - HW04-04
  allowed_paths:
  - services/collaboration/src/modules/harness/**
  - services/collaboration/src/modules/decisions/**
  - services/collaboration/src/modules/handoffs/**
  - packages/harness-contracts/**
  objective: 借鉴 Knowe Harness，但用服务端确定性状态机保证任务、裁决、交接和完成留痕。
  steps:
  - Harness 状态：draft/queued/running/waiting_user/blocked/succeeded/failed/cancelled。
  - Decision 状态：proposed/pending/approved/rejected/expired/executed。
  - Handoff 记录 from/to、理由、上下文、接受/拒绝和证据。
  - 用户 approved/rejected 是最高权威；模型建议不能覆盖。
  - 完成必须满足 validator，不接受文本声称完成。
  validation:
  - transition table
  - invalid transition
  - approve/reject race
  - cancel/late event
  - restart recovery
  acceptance:
  - 每次状态变化产生注册事件
  - 决策和交接不可静默丢失
  evidence:
  - harness-state-machine-report.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-architecture-security
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_architecture_security
  acceptance_outcome: ACCEPT
- id: HW05-05
  title: 实现 Command Dispatcher 与 Action Receipt
  primary_owner: terra_worker
  supporting_agents:
  - terra_tester
  - terra_security
  execution_mode: workspace-write
  parallel_group: C
  risk: high
  depends_on:
  - HW05-02
  - HW05-04
  allowed_paths:
  - services/gateway/src/commands/**
  - services/collaboration/src/modules/command-receipts/**
  - packages/capability-sdk/**
  objective: 统一接收 Workspace 卡片动作、路由到领域服务，并将 pending/accepted/rejected/conflict 回执投影回线程。
  steps:
  - Gateway 验证 CSRF、Principal、capability、action permission 和 payload schema。
  - 领域服务再次执行权限/Scope/状态/version 检查。
  - Command Receipt 记录 accepted/rejected/conflict，不把 HTTP 200 等同业务完成。
  - 重复 commandId 返回原结果。
  - 超时后客户端查询 receipt，避免盲目重试。
  validation:
  - double click
  - timeout/unknown result
  - 403/409
  - replay
  - stale session
  acceptance:
  - 重复动作不重复写业务
  - 错误可诊断且时间线一致
  evidence:
  - command-receipt-matrix.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW05-06
  title: 实现 Context Resolver 与最小化快照
  primary_owner: terra_worker
  supporting_agents:
  - terra_contracts
  - terra_security
  execution_mode: workspace-write
  parallel_group: C
  risk: high
  depends_on:
  - HW05-01
  - HW02-05
  allowed_paths:
  - services/gateway/src/context/**
  - packages/context-contracts/**
  - apps/workspace-web/src/context/**
  objective: 为线程提供人员、组织、位置、患者、资产和项目上下文引用，但每次展示都重新授权并最小化。
  steps:
  - ContextRef 只保存类型/id/version；显示快照由 owner service 解析。
  - 患者/临床上下文默认不进入通知或本地缓存。
  - Context panel 按 permission/scope 懒加载。
  - 版本变化和撤权后旧快照失效。
  validation:
  - authorization matrix
  - stale context
  - redaction
  - cache absence
  acceptance:
  - 跨用户/科室不能复用敏感上下文
  - 线程可解释当前处理对象
  evidence:
  - context-security-report.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW05-07
  title: 实现 Workspace Space/Thread/Timeline/Card/Canvas Runtime
  primary_owner: terra_worker
  supporting_agents:
  - terra_browser
  - luna_fixtures
  execution_mode: workspace-write
  parallel_group: D
  risk: medium
  depends_on:
  - HW05-02
  - HW05-03
  - HW05-05
  - HW05-06
  allowed_paths:
  - apps/workspace-web/src/features/spaces/**
  - apps/workspace-web/src/features/threads/**
  - apps/workspace-web/src/features/timeline/**
  - apps/workspace-web/src/features/cards/**
  - apps/workspace-web/src/features/canvas/**
  objective: 完成新产品的核心交互骨架：用户围绕工作项处理，不围绕系统菜单跳转。
  steps:
  - 左侧空间/队列，中间线程时间线，右侧 Context/Canvas。
  - 时间线统一显示用户、系统、Agent、决策、附件和错误活动。
  - Card Registry 编译期注册；Capability Route 与 Registry 一致。
  - 支持 deep link、刷新重建、键盘和无障碍。
  - 大线程采用分页/虚拟化，不把全部历史加载到内存。
  validation:
  - component/e2e
  - a11y
  - deep link refresh
  - long timeline performance
  acceptance:
  - 可用 synthetic fixtures 完成完整动作
  - UI 不自行创造业务完成状态
  evidence:
  - workspace-runtime-evidence.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
