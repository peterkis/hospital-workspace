schemaVersion: hospital-workspace.phase.v1
program: hospital-workspace
targetRepository: peterkis/hospital-workspace
legacySource:
  mode: optional-local
  required: false
  absencePolicy: reimplement-from-target-contracts
  configPath: config/local/legacy-source.yaml
referenceSource:
  repository: HirezmingD/Knowe-agent-groupchat
  commit: 1e584f84734e9db55515ef4391fcb9e9c40399cd
id: HW-00
title: 新仓创建与 Clean Foundation
goal: 建立一个没有旧 Phase 脚本、旧 Next.js 门户、旧数据库迁移和旧 Issues 负担的公共 monorepo，并冻结产品使命、工具链、依赖方向、代码所有权、迁移来源与第一组 ADR。
dependsOn: []
deliverables:
- 公共仓库 `peterkis/hospital-workspace`
- 根 `AGENTS.md`、`.codex/` Luna/Terra/Sol 子代理配置
- Node/pnpm/TypeScript 基础、唯一 lockfile、基础 CI
- 目标目录骨架与依赖边界检查器
- Legacy Source Manifest 与 Knowe Adoption Matrix
- ADR-0001～ADR-0007
- F0 Clean Foundation Gate 证据
outOfScope:
- 迁移任何业务应用
- 实现真实登录、Hub、数据库业务模型或 Tauri 原生功能
- 复制旧仓历史脚本、Evidence、Issue 或 migration
- 创建兼容旧 URL、Cookie、API 或数据结构的适配层
acceptance:
- 新仓从 clean clone 可 frozen install 并运行 required checks
- 根指令和 Luna/Terra/Sol agents 可被 Codex发现
- 只有一个 lockfile、一个 Program 和一个允许 no-source 模式的 Legacy Source Manifest
- 依赖 DAG/路径所有权/迁移来源负向测试可阻断错误
- 仓库不存在旧 Next UI、旧 migration、旧 Phase scripts 和未登记 legacy copy
gates:
- G00-1 新仓与工具链唯一性
- G00-2 文档、指令和子代理发现
- G00-3 依赖方向与路径所有权
- G00-4 可选来源策略与迁移可追溯
- G00-5 零遗留运行依赖
tasks:
- id: HW00-01
  title: 创建公共仓库、公共数据边界与初始治理
  primary_owner: parent_codex
  supporting_agents:
  - luna_docs
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: A
  risk: high
  depends_on: []
  allowed_paths:
  - README.md
  - AGENTS.md
  - .codex/**
  - docs/**
  - .github/**
  - .gitignore
  - .gitattributes
  objective: 初始化新仓，使任何 Agent 在写代码前都能识别产品目标、绿地规则、禁止迁移项和 Gate 流程。
  steps:
  - 创建公共仓库，首次安全提交进入 `main` 后导入并启用 Ruleset，要求 PR 与 `checks`。
  - 安装本包的 `AGENTS.md`、`.codex/agents`、Program、ADR 和治理文档。
  - 在 README 明确旧源完全可选；缺失时按目标契约重新实现，存在时也只能作为只读参考，不能成为 Git 子模块或运行依赖。
  - 建立 PR 模板、CODEOWNERS 或角色所有权文件；父代理保留最终安全和发布裁决。
  - 验证新 Codex 会话能列出根指令与 Luna/Terra/Sol custom agents。
  validation:
  - Codex 指令发现
  - TOML/Markdown/YAML/JSON 结构校验
  - AGENTS 合并字节预算检查
  - 公共仓库 Ruleset、required `checks` 和禁止直接推送人工核对
  acceptance:
  - 仓库为空白绿地状态，无旧业务代码
  - 根指令小于默认 32 KiB，并明确新架构唯一 Program
  - Luna/Terra/Sol 配置可被 Codex识别
  evidence:
  - 仓库设置截图/收据
  - instruction-discovery.log
  - initial-tree.txt
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW00-02
  title: 固定 Node、pnpm、TypeScript 与 Workspace 合同
  primary_owner: terra_worker
  supporting_agents:
  - luna_inventory
  - terra_tester
  execution_mode: workspace-write
  parallel_group: B
  risk: medium
  depends_on:
  - HW00-01
  allowed_paths:
  - package.json
  - pnpm-workspace.yaml
  - pnpm-lock.yaml
  - .npmrc
  - .nvmrc
  - tsconfig*.json
  - scripts/governance/**
  objective: 建立唯一包管理器和最小根命令，避免把旧仓 Phase 01/02 根脚本迁入新仓。
  steps:
  - 固定 Node 24.18.0 和 pnpm 11.17.0；只有一个 `pnpm-lock.yaml`。
  - 创建最小 workspace 清单：初始只登记真实存在的 app/service/package。
  - 定义 `build`、`lint`、`typecheck`、`test`、`check`、`format:check` 六个 canonical 命令。
  - 禁止 npm/yarn/bun lockfile、`--if-present`、空脚本和静默跳过。
  - 建立 workspace contract checker，要求每个 workspace 声明质量命令或明确 N/A 依据。
  validation:
  - pnpm install --frozen-lockfile
  - workspace inventory
  - second-lock negative test
  - missing-script negative test
  acceptance:
  - 唯一 lockfile
  - 从干净 clone 可 frozen install
  - 根命令不含 legacy phase 命名和 npm fallback
  evidence:
  - toolchain-report.json
  - workspace-inventory.json
  - negative-tests.log
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW00-03
  title: 冻结目标目录与依赖 DAG
  primary_owner: terra_contracts
  supporting_agents:
  - luna_explorer
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: B
  risk: medium
  depends_on:
  - HW00-01
  allowed_paths:
  - docs/architecture/**
  - docs/governance/**
  - scripts/governance/**
  - packages/**/package.json
  - apps/**/package.json
  - services/**/package.json
  objective: 把 apps、platform services、domain services、pure contracts、infrastructure 和 database 的依赖方向固化为机器门禁。
  steps:
  - 记录终局目录和 Foundation 阶段允许创建的最小目录。
  - 定义 `apps -> sdk/contracts`、`services -> repositories/contracts`、`contracts -> pure utilities`。
  - 禁止 frontend 依赖 Prisma/pg/Redis/server-only，禁止 domain service 依赖 UI。
  - 禁止跨领域 repository 深层导入和跨 schema 写入。
  - 实现依赖图检查与循环检测 fixtures。
  validation:
  - dependency DAG positive/negative fixtures
  - workspace protocol scan
  - deep-import negative test
  acceptance:
  - 依赖图无环
  - 每条禁止边可被自动检测
  - 目录不是预创建的大而空框架；只有当前阶段真实需要的 workspace
  evidence:
  - dependency-graph.json
  - boundary-check.log
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW00-04
  title: 建立 Legacy Source Manifest
  primary_owner: terra_migrator
  supporting_agents:
  - luna_inventory
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: C
  risk: high
  depends_on:
  - HW00-01
  allowed_paths:
  - docs/migration/**
  - scripts/migration/**
  objective: 建立可选本地旧代码源的只读迁移边界，任何迁移文件必须记录来源、测试和改造状态。
  steps:
  - 默认登记 sourceMode=none；仅在所有者明确配置可选本地旧源时，登记 source label、完整 commit、source path、target path、license、迁移模式和 owner。
  - 对白名单资产分为 COPY-ADAPT、EXTRACT、REFERENCE-ONLY、DO-NOT-MIGRATE。
  - 禁止直接 cherry-pick 大提交、复制根 package/lock/Prisma migrations/Phase scripts。
  - 定义迁移收据格式，迁移后记录源文件 hash 与目标 diff。
  - 建立 manifest checker，未登记 legacy copy 必须失败。
  validation:
  - manifest schema test
  - unknown source negative test
  - source commit/hash verification
  acceptance:
  - 所有实际采用的旧资产可追溯；无旧源时有明确 no-source 记录
  - 新仓不依赖旧仓运行时或 Git 子模块
  - 本地 W0 治理提交不是新仓构建依赖
  evidence:
  - LEGACY-SOURCE-MANIFEST.yaml
  - migration-policy-test.log
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-acceptance
  acceptance_agents:
  - terra_reviewer
  - sol_acceptance
  acceptance_outcome: ACCEPT
- id: HW00-05
  title: 冻结 Knowe 借鉴与排除矩阵
  primary_owner: luna_docs
  supporting_agents:
  - luna_explorer
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: C
  risk: low
  depends_on:
  - HW00-01
  allowed_paths:
  - docs/migration/KNOWE-ADOPTION-MATRIX.md
  - docs/architecture/**
  objective: 只借鉴 Knowe 的群聊协作、Coordinator/Worker、Harness、Handoff、用户裁决、知识生命周期和事件回放思想，不复制其不适合医院生产的运行边界。
  steps:
  - 把每个借鉴点映射到 Hospital Workspace 的具体模块与阶段。
  - 明确不采用 Electron、客户端 Python 后端、JSONL 业务真相、任意 Shell/文件工具和客户端模型 API Key。
  - 记录 Knowe 固定 commit 和 MIT 来源，仅在实际复制代码时才触发许可证归属流程。
  - 将群聊定义为业务投影和协作界面，而不是数据库或状态机。
  validation:
  - 文档链接与 commit 校验
  - adoption/exclusion pair completeness
  acceptance:
  - 每项借鉴都有 Hospital Workspace 落点
  - 每项高风险机制都有明确排除或安全替代
  evidence:
  - KNOWE-ADOPTION-MATRIX.md
  - source-reference-report.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW00-06
  title: 创建基础 CI 与证据框架
  primary_owner: terra_tester
  supporting_agents:
  - luna_fixtures
  - terra_reviewer
  execution_mode: workspace-write
  parallel_group: D
  risk: medium
  depends_on:
  - HW00-02
  - HW00-03
  allowed_paths:
  - .github/workflows/**
  - scripts/governance/**
  - docs/program/templates/**
  - evidence/**
  objective: 让新仓从第一个提交开始具备可阻断的构建、契约、边界、证据和密钥检查。
  steps:
  - 建立 Ubuntu required `checks`，执行 frozen install、build、lint、typecheck、test、governance。
  - 建立 secret scan、生成物污染、源目录 `.js/.d.ts` 污染和 lockfile 唯一性检查。
  - 创建 Evidence Manifest JSON Schema，PASS 禁止包含 NOT_RUN/FAIL。
  - 定义 Windows/Tauri 和 Anolis 验收为独立环境门，不能由 Linux 冒充。
  - 建立 gate decision 与 rollback receipt 模板。
  validation:
  - CI dry run/static validation
  - evidence schema positive/negative tests
  - secret fixture negative test
  acceptance:
  - required checks 可在空骨架中稳定通过
  - 未执行平台测试不会被标为 PASS
  - 证据不允许真实患者数据或秘密
  evidence:
  - CI run
  - evidence-schema-report.json
  - secret-scan-report.json
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: terra
  acceptance_agents:
  - terra_reviewer
  acceptance_outcome: APPROVED
- id: HW00-07
  title: 接受 Foundation ADR 与 F0 Gate
  primary_owner: parent_codex
  supporting_agents:
  - terra_reviewer
  - terra_security
  execution_mode: read-only
  parallel_group: E
  risk: critical
  depends_on:
  - HW00-02
  - HW00-03
  - HW00-04
  - HW00-05
  - HW00-06
  allowed_paths:
  - AGENTS.md
  - .codex/**
  - docs/**
  - .github/**
  - package.json
  - pnpm-workspace.yaml
  - pnpm-lock.yaml
  - scripts/governance/**
  objective: 独立确认新仓是干净目标架构，而不是旧仓的第二份复制。
  steps:
  - 复核 ADR-0001～0007、Source Manifest、目录 DAG、模型路由和风险登记。
  - 检查是否出现 Next.js、旧 migration、旧 phase scripts、旧 URL/Cookie 兼容或未登记 legacy copy。
  - 核对 GitHub checks、证据真实性和 rollback。
  - 签发 `F0-CLEAN-FOUNDATION=PASS/BLOCKED`。
  validation:
  - 全仓 governance
  - git diff --check
  - dependency graph
  - manifest audit
  acceptance:
  - P0/P1 为零
  - F0 仅代表允许开始迁移基础资产，不代表试点或生产
  evidence:
  - F0-gate-decision.md
  - independent-review.md
  stop_if:
  - 需要修改未在 allowed_paths 中声明的路径
  - 需要改变已接受 ADR、身份/Session、授权/Scope、TLS、原生权限或数据所有权边界
  - 需要新增生产依赖、破坏性数据库操作或对外部系统写入，但任务未明确授权
  - 当前工作树包含无法归属的用户修改；若本任务主动采用可选旧源，则该旧源无法绑定固定 commit
  acceptance_tier: sol-phase-gate
  acceptance_agents:
  - terra_reviewer
  - terra_security
  - sol_phase_gate
  acceptance_outcome: PASS_RECOMMENDED
acceptance_policy:
  task_routing:
    low_medium:
      required_agents:
      - terra_reviewer
      required_outcome: APPROVED
    high:
      required_agents:
      - terra_reviewer
      - sol_acceptance
      required_sol_outcome: ACCEPT
    critical:
      required_agents:
      - terra_reviewer
      - terra_security
      - sol_architecture_security
      required_sol_outcome: ACCEPT
      exception: Critical tasks that are primarily E2E/acceptance evidence route to sol_acceptance instead of sol_architecture_security.
  phase_gate:
    required_agents:
    - sol_phase_gate
    required_sol_phase_outcome: PASS_RECOMMENDED
    final_decision_owner: parent_codex
    human_decision_required: false
  sol_unavailable: BLOCKED unless the user explicitly approves a model-routing change; no silent substitution.
