workspacesBefore: [apps/workspace-web]
workspacesAfter: [apps/workspace-web, services/gateway]
apiClientWorkspace:
  path: packages/api-client
  disposition: intentionally-deferred
  reason: One browser consumer does not justify another workspace yet.
  ownership: No explicit PATH-OWNERSHIP rule.
  resolution: ownership gap avoided by minimal topology; no ownership mutation required.
browserApiBoundary:
  directory: apps/workspace-web/src/platform/api
  fetchFile: apps/workspace-web/src/platform/api/mvp-api-client.ts
  methods: [readBootstrap, sendCommand]
  consumer: apps/workspace-web/src/capabilities/tickets
  compositionRoot: apps/workspace-web/src/App.tsx
  transportInjection: Required; App creates the client and Ticket receives it.
  endpointArgument: false
  callerHeadersArgument: false
  requestInitArgument: false
  credentials: omit
  redirect: error
  cache: no-store
  mode: same-origin
  timeoutMs: 5000
  maximumResponseBytes: 8192
  invalidResponse: quarantine-without-local-transition
  commandRetry: Explicit only; frozen envelope after transport failure, new identity after resolved rejection or conflict.
  bootstrapFallback: forbidden
  commandFallback: forbidden
gatewayBoundary:
  directory: services/gateway
  packageName: '@hospital/gateway'
  layer: platform-service
  ownerRole: identity-access-owner
  reviewRoles: [security-reviewer, architecture-reviewer]
  risk: critical
  bindHost: '::1'
  port: 3001
  hostOrPortOverride: false
  trustProxy: false
  allowedHostHeaders: ['localhost:5173', '[::1]:3001']
  allowedPresentOrigins: ['http://localhost:5173']
  missingOriginForLocalTools: allowed
  nullOrigin: rejected
  maxRequestBodyBytes: 4096
  requestTimeoutMs: 5000
  logger: false
  exposeHeadRoutes: false
  responseHeaders:
    cache-control: no-store
    x-content-type-options: nosniff
  validation:
    provider: Fastify-native-static-JSON-Schema
    additionalProperties: false
    coerceTypes: false
    removeAdditional: false
    useDefaults: false
  forbiddenRuntimeCapabilities:
    - Ticket aggregate store or lifecycle state machine
    - repository or durable receipt/idempotency store
    - domain events or Outbox
    - database or Redis
    - filesystem, shell or subprocess operations
    - outbound HTTP or user-directed proxy
    - authentication, Authz, security Scope or Session
    - token, cookie or secret custody
    - request-body, access or raw error logging
  testOnlyFileReads: Source/format checks may read files; handlers may not.
sameOriginStrategy:
  kind: fixed-vite-development-proxy
  browserOrigin: http://localhost:5173
  viteConfig: apps/workspace-web/vite.config.ts
  viteHost: localhost
  vitePort: 5173
  strictPort: true
  allowedHosts: [localhost]
  viteCors: false
  proxyKey: '^/api/mvp/'
  target: http://[::1]:3001
  loopbackSelection: Explicit IPv6 loopback; current Public Safety rejects numeric IPv4 loopback references.
  ipv6Unavailable: Fail startup and acceptance; no alternate-address fallback.
  rewrite: false
  changeOrigin: false
  ws: false
  stripHeaders: [cookie, authorization, proxy-authorization, 'x-hospital-*']
  directGatewayCredentialHeaders: rejected
  gatewayCorsPlugin: false
  accessControlAllowOrigin: absent
  arbitraryTarget: false
  proxyFailure: 502-LOCAL_GATEWAY_UNAVAILABLE-fixed-public-safe-envelope
  healthProxied: false
  vitePreview: static-only-not-MVP04-runtime
  hmr: Vite infrastructure only; no product WebSocket capability.
routePrefix: /api/mvp
readEndpoints:
  - method: GET
    path: /healthz
    query: none
    purpose: Local process health only; no environment details or dependency readiness claim.
    response: {status: ok, synthetic: true, boundary: local-prototype}
  - method: GET
    path: /api/mvp/bootstrap
    query:
      required: [persona]
      persona: [reporter, engineer]
      additionalProperties: false
      duplicatePersona: rejected
    responseFields: [synthetic, boundary, notice, persona, capabilities]
    capabilityId: tickets
    capabilityLabel: Synthetic Tickets
    capabilityActions: Exact actions for the selected synthetic persona.
    notice: Synthetic persona presentation only; no authentication, authorization or Session.
commandEndpoints:
  - method: POST
    path: /api/mvp/commands
    query: none
    contentType: application/json-with-optional-utf8-charset-only
    requiredFields: [ticketId, action, commandId, idempotencyKey, expectedVersion, observedVersion, personaId]
    optionalFields: [correlationId]
    additionalProperties: false
    ticketId: demo-ticket-workstation-output-001
    actions: [submit, triage, assign, accept, start_progress, resolve, confirm_close, reopen]
    personaIds: [synthetic-persona-reporter, synthetic-persona-engineer]
    versions: {type: integer, minimum: 0, maximum: 1000000, authority: browser-supplied}
    commandId: {pattern: '^demo-ticket-command-[a-z0-9_-]+$', maxLength: 128}
    idempotencyKey: {pattern: '^demo-ticket-idempotency-[a-z0-9_-]+$', maxLength: 128}
    correlationId: {pattern: '^synthetic-correlation-[a-z0-9-]+$', maxLength: 64}
    receiptFields: [commandId, idempotencyKey, state, expectedVersion, observedVersion, reason, synthetic, boundary]
    optionalReceiptFields: [correlationId]
    receiptStates: [accepted, rejected, conflict]
    receiptReasons: [SYNTHETIC_ENVELOPE_ACCEPTED, PERSONA_ACTION_MISMATCH, VERSION_CONFLICT]
    receiptMarkers: {synthetic: true, boundary: local-prototype}
    decisionOrder:
      - Reject structurally invalid HTTP or envelope before semantic evaluation.
      - Unknown persona returns 400 UNKNOWN_SYNTHETIC_PERSONA.
      - Unknown action returns 400 UNKNOWN_ACTION.
      - Known disallowed persona/action returns 200 rejected PERSONA_ACTION_MISMATCH.
      - Allowed action with unequal submitted versions returns 409 conflict VERSION_CONFLICT.
      - Otherwise return 200 accepted SYNTHETIC_ENVELOPE_ACCEPTED.
    determinism: Same valid envelope gives the same JSON values, including across restarts.
    idempotencyAuthority: none
    alteredEnvelopeWithReusedKey: Evaluated anew; no server replay ledger.
    completionMeaning: No domain completion, persistence or authoritative result.
syntheticPersonas:
  - persona: reporter
    personaId: synthetic-persona-reporter
    displayName: Synthetic Reporter
    roles: [reporter]
    scopes: ['tickets:read', 'tickets:submit', 'tickets:close', 'tickets:reopen']
    actions: [submit, confirm_close, reopen]
    synthetic: true
  - persona: engineer
    personaId: synthetic-persona-engineer
    displayName: Demo IT Engineer
    roles: [engineer]
    scopes: ['tickets:read', 'tickets:triage', 'tickets:assign', 'tickets:accept', 'tickets:progress', 'tickets:resolve']
    actions: [triage, assign, accept, start_progress, resolve]
    synthetic: true
syntheticRoles: [reporter, engineer]
syntheticScopes: ['tickets:read', 'tickets:submit', 'tickets:triage', 'tickets:assign', 'tickets:accept', 'tickets:progress', 'tickets:resolve', 'tickets:close', 'tickets:reopen']
personaBoundary:
  meaning: Presentation and deterministic prototype constraints only.
  authenticatedPrincipal: false
  realRoleAssignment: false
  serverAuthz: false
  securityScope: false
  session: false
  hospitalIdentity: false
  visibleUiMarker: PUBLIC-SYNTHETIC / non-production / Asia/Shanghai
  pendingSwitch: Abort and invalidate; bootstrap the new persona without resetting the local Ticket.
  generation: Monotonic in-memory counter; A-to-B-to-A cannot revive late work.
authorityMatrix:
  ticketAggregate: {mvp04: browser-nonauthoritative-projection-only, mvp05: services/tickets-in-memory-prototype}
  ticketTransitions: {mvp04: existing-browser-demonstration-table, mvp05: services/tickets}
  commandReceipt: {mvp04: stateless-gateway-envelope-evaluation, mvp05: Ticket-service-decision-through-Gateway}
  personaPresentation: {mvp04: gateway-fixed-synthetic-descriptor, mvp05: synthetic-until-separate-hardening}
  roleScopePresentation: {mvp04: fixed-prototype-strings, mvp05: no-canonical-Authz-claim}
  httpTransport: {mvp04: app-local-client-vite-gateway, mvp05: separately-planned-gateway-ticket-boundary}
  persistence: {mvp04: none, mvp05: in-memory-restart-loss-only}
  idempotency: {mvp04: local-browser-suppression-only, mvp05: services/tickets-in-memory-ledger}
  expectedVersion: {mvp04: compare-two-browser-claims, mvp05: services/tickets-aggregate-check}
  domainEvent: {mvp04: no-production-event, mvp05: services/tickets-prototype-output}
  outbox: {mvp04: none, mvp05: none-canonical-work-deferred}
  canonicalAuthenticationAndSession: unchanged-and-unimplemented
  finalProductionState: Requires a domain event; receipt.accepted is not domain completed.
errorModel:
  fields: [code, message, synthetic, boundary]
  optionalFields: [correlationId]
  correlation: Echo only a supplied value passing the frozen bounds; never generate one.
  messages: Fixed public-safe strings; no raw input, framework details, paths or environment.
  codes:
    INVALID_REQUEST: 400
    UNKNOWN_SYNTHETIC_PERSONA: 400
    UNKNOWN_ACTION: 400
    NOT_FOUND: 404
    METHOD_NOT_ALLOWED: 405
    REQUEST_TOO_LARGE: 413
    UNSUPPORTED_MEDIA_TYPE: 415
    INTERNAL_ERROR: 500
    LOCAL_GATEWAY_UNAVAILABLE: 502
  conflictReceipt: {reason: VERSION_CONFLICT, status: 409}
  clientErrors: [TIMEOUT, CANCELLED, UNAVAILABLE, INVALID_RESPONSE]
  clientLocalApplicationOutcome: Distinct from the immutable wire receipt.
