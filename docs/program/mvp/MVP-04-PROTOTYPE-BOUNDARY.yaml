implementationPacketExecution: prohibited-in-preflight
implementationOrdering: Sequential; at most one writer for all shared/root files.
reviewRequirements:
  treeBinding: Both receipts reference the same final staged git write-tree.
  receiptStorage: External parent-session receipt only; never inside the reviewed tree.
  required:
    - {agent: terra_reviewer, model: gpt-5.6-terra, reasoningEffort: high, mode: read-only, outcome: APPROVED, maximumP0: 0, maximumP1: 0}
    - {agent: terra_security, model: gpt-5.6-terra, reasoningEffort: max, mode: read-only, outcome: APPROVED, maximumP0: 0, maximumP1: 0}
  ownerReviewPreserved: true
  approvalMeaning: Correct resumed planning decision only; governance ownership resolution is not dependency or implementation approval.
  solInvoked: false
  canonicalChangeResponse: Stop with SOL-ROUTE-REQUIRED; do not change accepted architecture or security.
  postReviewMutation: Restage, refreeze and rerun both reviewers.
stopConditions:
  - Starting branch, commit, tree, remote main or clean-state binding differs.
  - MVP04-GOV-01 resolution or governance-main binding differs from the recorded evidence.
  - Unapproved path, dependency, ownership or architecture change is needed.
  - Ticket aggregate, lifecycle or persistence authority would enter Gateway.
  - Real identity, Session, Authz, hospital/private endpoint or secret becomes necessary.
  - A review is missing, rejected, stale or bound to a different tree.
  - The design needs a canonical security change; report SOL-ROUTE-REQUIRED.
nonGoals:
  - No runtime implementation, workspace creation, dependency installation or server startup in preflight.
  - No product, manifest, lock, Vite, dependency-policy or PATH-OWNERSHIP modification in preflight.
  - No packages/api-client or canonical identity/command/Ticket contract package.
  - No real authentication, authorization, Session, Redis, database, hospital/private-network integration or Tauri.
  - No domain authority in Gateway, production event, Outbox, real attachment, Agent/model execution or synchronized-browser guarantee.
  - No HW02-01, HW02-03 or HW05-05 completion; no MVP-05 start.
  - No committed Evidence, commit, push, PR, pilot or production claim.
